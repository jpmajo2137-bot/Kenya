<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- 보안: Content Security Policy (Strict, 명시적 화이트리스트만 허용) -->
    <!-- 주의: Vite legacy 플러그인이 'unsafe-inline'/'unsafe-eval' 을 요구하므로 유지.
         WebView 내부에서만 동작하므로 외부 XSS 위험은 매우 제한적. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://www.google-analytics.com https://www.gstatic.com https://www.google.com;
      script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://www.google-analytics.com https://www.gstatic.com https://www.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https://*.supabase.co https://*.supabase.com https://*.googleusercontent.com https://*.gstatic.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.googleadservices.com;
      media-src 'self' data: blob: https://*.supabase.co https://*.googleapis.com;
      connect-src 'self' https://*.supabase.co https://*.supabase.com wss://*.supabase.co https://api.openai.com https://texttospeech.googleapis.com https://generativelanguage.googleapis.com https://ip-api.com https://ipapi.co https://www.google-analytics.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://*.firebaseio.com https://*.firebase.google.com https://firebaseinstallations.googleapis.com;
      frame-src 'self' https://googleads.g.doubleclick.net https://www.google.com https://tpc.googlesyndication.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      manifest-src 'self';
      upgrade-insecure-requests;
      block-all-mixed-content;
    " />
    
    <!-- 보안 헤더 (HTTP 응답으로 설정 권장이지만 Capacitor 내부에서도 보조 효과) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no, email=no, address=no, date=no" />
    
    <!-- 모바일 최적화: 줌 방지, safe-area 지원 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- iOS 홈 화면 앱 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- 테마 색상 -->
    <meta name="theme-color" content="#070a12" />
    
    <meta name="description" content="JHP 영어 단어 암기 — Oxford 5000 영어 단어를 한국어로 공부하는 단어장." />
    <meta name="keywords" content="JHP 영어 단어 암기, 영어 단어장, Oxford 5000, 영어 암기, English vocabulary" />
    <meta property="og:title" content="JHP 영어 단어 암기" />
    <meta property="og:description" content="Oxford 5000 영어 단어를 한국어로 공부하세요. Day별 학습, 퀴즈, 오답노트, 사전." />
    <meta name="apple-mobile-web-app-title" content="JHP 영어 단어 암기" />
    <title>JHP 영어 단어 암기</title>
  </head>
  <body style="margin:0;min-height:100vh;background:#070a12;color:#f3f4f6">
    <!-- #root 에 flex 를 걸지 않는다.
         이전에는 display:flex;align-items:center;justify-content:center 가 있어
         React 마운트 후 앱 루트 div 가 화면 가운데에 좁게(content-width) 자리잡아
         max-w-md 가 적용되지 않는 비주얼 버그가 있었음. -->
    <div id="root" style="min-height:100vh;background:#070a12">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:rgba(255,255,255,0.7)">Loading...</div>
    </div>
    <script>
      // Service Worker + Cache Storage 강제 정리 (번들 JS 로드 전에 실행)
      (function(){try{
        if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(reg){reg.unregister()})})}
        if(typeof caches!=='undefined'){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}
      }catch(e){}}())
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
